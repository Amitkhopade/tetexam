<title>Question Paper Navigator</title>

<!-- Glassmorphism / 3D visual foundation.
     Does NOT modify application logic. -->

<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.10);
    --glass-bg-strong: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 255, 255, 0.22);
    --glass-highlight: rgba(255, 255, 255, 0.30);
    --glass-shadow:
      0 25px 60px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.20);
    --glass-radius: 20px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    width: 100%;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
      radial-gradient(
        circle at 15% 20%,
        rgba(59, 130, 246, 0.30),
        transparent 32%
      ),
      radial-gradient(
        circle at 85% 15%,
        rgba(139, 92, 246, 0.28),
        transparent 30%
      ),
      radial-gradient(
        circle at 70% 85%,
        rgba(14, 165, 233, 0.22),
        transparent 32%
      ),
      linear-gradient(
        135deg,
        #020617 0%,
        #0f172a 45%,
        #111827 100%
      );

    background-attachment: fixed;

    color: #f8fafc;

    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  /*
   * Ambient 3D light effects.
   * Purely visual — no application logic.
   */
  body::before,
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
  }

  body::before {
    width: 320px;
    height: 320px;
    top: -100px;
    left: -80px;
    background: rgba(59, 130, 246, 0.45);
  }

  body::after {
    width: 360px;
    height: 360px;
    right: -100px;
    bottom: -100px;
    background: rgba(124, 58, 237, 0.38);
  }

  #root {
    min-height: 100vh;
    position: relative;
    isolation: isolate;
  }

  /*
   * Generic glass surface.
   * Existing components can inherit this visual treatment
   * without changing their underlying functionality.
   */
  #root > * {
    position: relative;
  }

  /*
   * Common UI surfaces
   */
  #root button,
  #root input,
  #root select,
  #root textarea {
    font: inherit;
  }

  #root button {
    transition:
      transform 180ms ease,
      box-shadow 180ms ease,
      background 180ms ease,
      border-color 180ms ease;
  }

  #root button:hover {
    transform: translateY(-2px);
  }

  #root button:active {
    transform: translateY(0) scale(0.98);
  }

  /*
   * Glass inputs
   */
  #root input,
  #root select,
  #root textarea {
    background: rgba(255, 255, 255, 0.08);
    color: #f8fafc;
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 8px 25px rgba(0, 0, 0, 0.12);
    outline: none;
  }

  #root input:focus,
  #root select:focus,
  #root textarea:focus {
    border-color: rgba(96, 165, 250, 0.70);
    box-shadow:
      0 0 0 3px rgba(59, 130, 246, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  /*
   * Scrollbar
   */
  ::-webkit-scrollbar {
    width: 9px;
    height: 9px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.03);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.20);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.32);
    background-clip: padding-box;
  }

  /*
   * Selection
   */
  ::selection {
    background: rgba(96, 165, 250, 0.35);
    color: white;
  }

  /*
   * Reduced-motion accessibility.
   */
  @media (prefers-reduced-motion: reduce) {
    #root button {
      transition: none;
    }

    #root button:hover {
      transform: none;
    }
  }
</style>
